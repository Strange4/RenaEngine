ignore:
  - "**/*Dockerfile"
  - "**/*.dockerignore"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  - "**/*.md"

coverage:
  status:
    project:
      game-server:
        target: 80%
        threshold: 0%
        flags:
          - game-server
        if_not_found: failure

      website:
        target: 80%
        threshold: 0%
        flags:
          - website
        if_not_found: failure

    patch:
      game-server:
        target: 80%
        threshold: 0%
        flags:
          - game-server
        if_not_found: failure

      website:
        target: 80%
        threshold: 0%
        flags:
          - website
        if_not_found: failure

flags:
  game-server:
    paths:
      - game-server/
    carryforward: false

  website:
    paths:
      - website/
    carryforward: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
