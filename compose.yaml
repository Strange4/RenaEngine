services:
  game-server:
    build:
      context: ./game-server
      dockerfile: ./docker/game-server.Dockerfile
      args:
        RenaOptions__TSProtoPath: ${RenaOptions__TSProtoPath:-/sdk-tools/node_modules/ts-proto/protoc-gen-ts_proto}
        RenaOptions__GenerationDirectory: ${RenaOptions__GenerationDirectory:-/sdks}
    environment:
      RenaOptions__TSProtoPath: ${RenaOptions__TSProtoPath:-/unused}
      RenaOptions__GenerationDirectory: ${RenaOptions__GenerationDirectory:-/sdks}
      RenaOptions__ServerPort: ${RenaOptions__ServerPort:-5000}
      RenaOptions__AdminToken: ${ADMIN_TOKEN:-ADMIN-change-me}
      RenaOptions__Features__test-feature: ${TEST_FEATURE_ENABLED:-false}
      RenaOptions__Features__sdk-downloads: ${SDK_DOWNLOADS_ENABLED:-false}
    ports:
      - "${RenaOptions__ServerPort:-5000}:${RenaOptions__ServerPort:-5000}"
    networks:
      - game-server-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: #needed for docker socket to be usable
      - "0"

  website:
    build:
      context: ./website
    environment:
      GAME_SERVER_URL: "http://game-server:${RenaOptions__ServerPort:-5000}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-ADMIN-change-me}
    depends_on:
      - game-server
    ports:
      - "${WEBSITE_CONTAINER_PORT:-3000}:${WEBSITE_CONTAINER_PORT:-3000}"
    networks:
      - game-server-network

networks:
  game-server-network:
    driver: bridge
