
services:
  game-server:
    build:
      context: ./game-server
      dockerfile: ./docker/game-server.Dockerfile
    env_file:
      - path: ./.env
        required: true
    ports:
      - "${GAME_SERVER_CONTAINER_PORT}:${RenaOptions__ServerPort}"
    networks:
      - game-server-network

networks:
  game-server-network:
    driver: bridge
