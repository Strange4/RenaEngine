
services:
  game-server:
    build:
      context: ./game-server
      dockerfile: ./docker/game-server.Dockerfile
      # make .env variables available during build
      args:
        - RenaOptions__TSProtoPath=${RenaOptions__TSProtoPath}
        - RenaOptions__GenerationDirectory=${RenaOptions__GenerationDirectory}
    # make .env available inside running container
    env_file:
      - path: ./.env
    ports:
      - "${GAME_SERVER_CONTAINER_PORT}:${RenaOptions__ServerPort}"
    networks:
      - game-server-network

networks:
  game-server-network:
    driver: bridge
