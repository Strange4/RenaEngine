name: Server Test CI

on:
  pull_request:
    paths:
      - "game-server/**"
      - ".github/workflows/server-test-ci.yaml"
  push:
    branches: [main]
    paths:
      - "game-server/**"
      - ".github/workflows/server-test-ci.yaml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./game-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "game-server/**/packages.lock.json"

      - name: DotNet Restore
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release

      - name: Test Project
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --filter "TestCategory!=SDKGeneration" 

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./Rena.Tests/TestResults/*/coverage.cobertura.xml
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=game-server
