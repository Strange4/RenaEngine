name: Server Test CI

on:
  pull_request:
    paths:
      - "game-server/**"
      - ".github/workflows/server-test-ci.yaml"
  push:
    branches: [main]
    paths:
      - "game-server/**"
      - ".github/workflows/server-test-ci.yaml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./game-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "game-server/**/packages.lock.json"

      - name: DotNet Restore
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release

      - name: Test Project
        run: dotnet test --no-build --configuration Release
