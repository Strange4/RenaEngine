name: Server Static Analysis CI

on:
  pull_request:
    paths:
      - "game-server/**"
      - ".github/workflows/server-static-analysis-ci.yaml"
  push:
    branches: [main]
    paths:
      - "game-server/**"
      - ".github/workflows/server-static-analysis-ci.yaml"

jobs:
  test:
    name: Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./game-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: 'game-server/src/packages.lock.json'

      - name: DotNet Restore
        run: dotnet restore

      - name: Verify Formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
